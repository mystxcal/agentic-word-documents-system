name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check schemas
        run: python -m agentic_docs.cli schema --check
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
