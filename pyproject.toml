[project]
name = "agentic-word-documents-system"
version = "0.2.0"
description = "Composable, agent-friendly document compiler with Markdown+ sources and Word-native output"
requires-python = ">=3.12"
dependencies = [
  "lxml>=5,<7",
  "openpyxl>=3.1,<4",
  "Pillow>=12,<13",
  "pypdf>=6,<7",
  "python-docx>=1.1,<2",
  "pydantic>=2.10,<3",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["coverage>=7,<8"]

[project.scripts]
agentic-doc = "agentic_docs.cli:main"
